spring:
  application:
    name: memoq-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:memoq}
    username: ${DB_USER:memoq}
    password: ${DB_PASSWORD:memoq}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine

  ai:
    anthropic:
      # Dev placeholder so the app boots without a real key; AI calls (category inference on
      # question create/update, see ai/CategoryInferenceService.java) will fail until a real
      # ANTHROPIC_API_KEY is provided.
      api-key: ${ANTHROPIC_API_KEY:sk-ant-placeholder-configure-me}
      chat:
        options:
          # Category inference is a cheap classification task; Haiku is the right size for it.
          model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      # spring-boot-starter-data-redis is always on the classpath (needed for the prod/redis
      # cache profile), but no Redis runs locally by default (spring.cache.type: caffeine) —
      # without this, actuator health/readiness would falsely report DOWN. Re-enabled in
      # application-prod.yml where Redis is actually expected to be reachable.
      enabled: false

security:
  jwt:
    # DEV ONLY default (32+ bytes for HS256). Always override via JWT_SECRET outside local dev.
    secret: ${JWT_SECRET:dev-only-secret-please-override-me-with-32-bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  admin:
    username: ${ADMIN_USERNAME:admin}
    # bcrypt hash of "changeit" — DEV ONLY. Always override via ADMIN_PASSWORD_HASH.
    password-hash: ${ADMIN_PASSWORD_HASH:$2y$10$ou.Vii99vDdGWLjVfHy8yeObwpxqidDx9qzZmBkIBNQqbwvPm0MAG}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://am.neuromancerdream.com,http://localhost:8081,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
