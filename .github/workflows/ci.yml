name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs the full suite, including Testcontainers-backed integration tests -- ubuntu-latest
      # runners ship Docker pre-installed and running, same requirement as running this locally.
      - name: Build and test
        run: ./gradlew build
